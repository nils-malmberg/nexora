[project]
name = "nexora-portfolio"
version = "0.1.0"
description = "Portfolio core module (auth, portfolios, transactions, valuation) for the NeXora investment dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.30,<0.31",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.1,<3.2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "email-validator>=2.1,<3",
    "argon2-cffi>=23.1,<24",
    "charset-normalizer>=3.3,<4",
    "python-multipart>=0.0.9,<0.1",
    "prometheus-client>=0.20,<0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.12,<3",
    "freezegun>=1.5,<2",
    "ruff>=0.5,<0.6",
    "coverage>=7.5,<8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# See backend/pyproject.toml for why this is needed: `tests.conftest` is
# imported by dotted path but isn't part of the installed `app*` package.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/api/*" = ["B008"]  # FastAPI's Depends()/Query() are meant to be used as defaults

[tool.coverage.run]
source = ["app"]
