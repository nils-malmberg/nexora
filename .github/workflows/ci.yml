name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/unit -q

  integration-sqlite:
    name: Integration tests (SQLite) + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      # Coverage over the full suite (unit + integration): adapters, the API
      # and the pipelines are exercised by integration tests. No test ever
      # reaches a real provider (see tests/conftest.py).
      - run: coverage run -m pytest tests -q
      - run: coverage report --fail-under=85

  migrations-postgres:
    name: Migrations from zero + upgrade (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexora_ci
          POSTGRES_USER: nexora_ci
          POSTGRES_PASSWORD: nexora_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXORA_DATABASE_URL: postgresql+psycopg://nexora_ci:nexora_ci@localhost:5432/nexora_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - name: Upgrade from zero
        run: alembic upgrade head
      - name: Downgrade to base (reversibility check)
        run: alembic downgrade base
      - name: Upgrade again
        run: alembic upgrade head
      - name: Run full test suite against Postgres
        run: python -m pytest tests -q

  security-scans:
    name: Secret + dependency + SAST scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]" bandit pip-audit
      - name: SAST (bandit)
        run: bandit -q -r app
      - name: Dependency vulnerability scan (pip-audit)
        # --skip-editable: our own local package isn't on PyPI. Not --strict:
        # that flag fails on ANY skipped/unauditable package, which our own
        # editable install always is - it would fail unconditionally, with
        # or without a real vulnerability. Exit code already reflects real
        # findings without it.
        run: pip-audit --skip-editable

  docker-build:
    name: Reproducible Docker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nexora-backend:ci ./backend
      - run: docker build -t nexora-frontend:ci ./frontend

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
