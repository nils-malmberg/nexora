services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      NEXORA_DATABASE_URL: ${NEXORA_DATABASE_URL:-postgresql+psycopg://nexora:change-me-locally@postgres:5432/nexora}
      # Plain HTTP for local docker-compose only: a `Secure` cookie is dropped
      # by the browser over HTTP. Any real deployment must sit behind HTTPS
      # and set this back to true (the app default).
      NEXORA_SESSION_COOKIE_SECURE: ${NEXORA_SESSION_COOKIE_SECURE:-false}
      # Market providers / prediction switch: settable from .env or the shell
      # (compose only forwards variables that are declared here).
      NEXORA_MARKET_EQUITY_PROVIDER: ${NEXORA_MARKET_EQUITY_PROVIDER:-yahoo}
      NEXORA_MARKET_CRYPTO_PROVIDER: ${NEXORA_MARKET_CRYPTO_PROVIDER:-coingecko}
      NEXORA_MARKET_FX_PROVIDER: ${NEXORA_MARKET_FX_PROVIDER:-frankfurter}
      NEXORA_MARKET_FUNDAMENTALS_PROVIDER: ${NEXORA_MARKET_FUNDAMENTALS_PROVIDER:-finnhub}
      NEXORA_PREDICTION_ENABLED: ${NEXORA_PREDICTION_ENABLED:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}
      DEMO_FIXTURES_BASE_URL: ${DEMO_FIXTURES_BASE_URL:-http://demo-fixtures:80}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000" # optional: direct API access (/docs). The frontend proxies /api itself.
    healthcheck:
      # No curl in the slim image; the stdlib is enough. `service_healthy`
      # below means migrations have actually finished, not just that the
      # process launched.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build: ./backend
    env_file:
      - .env
    environment:
      NEXORA_DATABASE_URL: ${NEXORA_DATABASE_URL:-postgresql+psycopg://nexora:change-me-locally@postgres:5432/nexora}
      SKIP_MIGRATIONS: "1" # safe only because we wait for api to be healthy (migrations done)
      SEED_DEMO_DATA: "0" # api is the single seeder
      NEXORA_MARKET_EQUITY_PROVIDER: ${NEXORA_MARKET_EQUITY_PROVIDER:-yahoo}
      NEXORA_MARKET_CRYPTO_PROVIDER: ${NEXORA_MARKET_CRYPTO_PROVIDER:-coingecko}
      NEXORA_MARKET_FX_PROVIDER: ${NEXORA_MARKET_FX_PROVIDER:-frankfurter}
    command: ["python", "-m", "app.worker.scheduler"]
    ports:
      - "9100:9100" # worker's own Prometheus /metrics (separate process from the api)
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  # Local-only static file server exposing the committed test fixtures, so
  # the "demo" profile can seed news providers that fetch synthetic content
  # over real HTTP without any external network access or account.
  demo-fixtures:
    image: nginx:alpine
    profiles: ["demo"]
    volumes:
      - ./backend/tests/fixtures:/usr/share/nginx/html:ro
    ports:
      - "8090:80"

volumes:
  postgres_data:
