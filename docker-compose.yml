services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      NEXORA_DATABASE_URL: ${NEXORA_DATABASE_URL:-postgresql+psycopg://nexora:change-me-locally@postgres:5432/nexora}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}
      DEMO_FIXTURES_BASE_URL: ${DEMO_FIXTURES_BASE_URL:-http://demo-fixtures:80}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    env_file:
      - .env
    environment:
      NEXORA_DATABASE_URL: ${NEXORA_DATABASE_URL:-postgresql+psycopg://nexora:change-me-locally@postgres:5432/nexora}
      SKIP_MIGRATIONS: "1" # the api service already applies migrations on startup
    command: ["python", "-m", "app.worker.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api

  # Local-only static file server exposing the committed test fixtures, so
  # the "demo" profile can seed providers that fetch synthetic content over
  # real HTTP without any external network access or account. Never used in
  # production; see scripts/seed_demo.py.
  demo-fixtures:
    image: nginx:alpine
    profiles: ["demo"]
    volumes:
      - ./backend/tests/fixtures:/usr/share/nginx/html:ro
    ports:
      - "8090:80"

volumes:
  postgres_data:
