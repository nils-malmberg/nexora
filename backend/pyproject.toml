[project]
name = "nexora"
version = "1.0.0"
description = "NeXora - unified multi-asset investment dashboard (markets, portfolio, analytics, news, experimental prediction)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.30,<0.31",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.1,<3.2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "email-validator>=2.1,<3",
    "argon2-cffi>=23.1,<24",
    "charset-normalizer>=3.3,<4",
    "python-multipart>=0.0.9,<0.1",
    "prometheus-client>=0.20,<0.21",
    "httpx>=0.27,<0.28",
    "feedparser>=6.0,<7",
    "icalendar>=5.0,<6",
    "apscheduler>=3.10,<3.11",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "respx>=0.21,<0.22",
    "freezegun>=1.5,<2",
    "ruff>=0.5,<0.6",
    "coverage>=7.5,<8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests.conftest` and `scripts.*` are imported by dotted path but aren't
# part of the installed `app*` package.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/api/*" = ["B008"]  # FastAPI's Depends()/Query() are meant to be used as defaults

[tool.coverage.run]
source = ["app"]
